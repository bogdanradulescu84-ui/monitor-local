name: Colectare feed-uri

on:
  schedule:
    # La fiecare două ore. Cron-ul GitHub e în UTC.
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Dacă toate sursele pică, colectorul iese cu cod ≠ 0 și nu atinge
      # data/articles.json — site-ul rămâne pe ultima colectare bună.
      - name: Trage feed-urile
        run: npm run collect

      - name: Commit dacă s-a schimbat ceva
        id: commit
        run: |
          if git diff --quiet -- data/articles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nimic nou."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/articles.json
            git commit -m "data: colectare $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
