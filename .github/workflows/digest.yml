name: Postarea zilnică

# Compune postarea de promovare a zilei, o publică pe pagina de Facebook prin
# Make și deschide un issue cu ce a plecat. Issue-ul e chitanță, nu sarcină:
# nu mai ai nimic de copiat.
#
# Make deține conexiunea cu pagina; aici pleacă doar textul. Regulile editoriale
# rămân în repo, aplicate la colectare.
#
# Se postează de două ori pe zi. Fereastra de timp e singurul lucru care ține
# postarea de seară să n-o repete pe cea de dimineață — nu ținem minte ce s-a
# publicat deja. Ferestrele sunt alese ca să se atingă, nu să se suprapună:
#
#   dimineața  09:10, fereastră 14h  → acoperă de aseară de la 19:00 până acum
#   seara      19:30, fereastră 10h  → acoperă de azi-dimineață de la 09:00
#
# Dacă muți orele, mută și ferestrele, altfel ori pierzi știri între ele, ori
# le publici de două ori.
on:
  schedule:
    # 06:10 UTC = 09:10 ora României vara, 08:10 iarna.
    - cron: "10 6 * * *"
    # 16:30 UTC = 19:30 vara, 18:30 iarna.
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      fereastra:
        description: "Din câte ore în urmă se iau știrile"
        default: "14"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Codurile de ieșire sunt semnificative:
      #   0 = avem text    3 = colectare mai veche de 26h    4 = nimic de postat
      - name: Compune postarea
        id: compose
        env:
          # Rularea de seară recunoscută după cron-ul care a declanșat-o.
          # La pornire manuală se ia valoarea din formular.
          FEREASTRA: ${{ github.event.schedule == '30 16 * * *' && '10' || (github.event.inputs.fereastra || '14') }}
        run: |
          echo "Fereastră: ultimele $FEREASTRA ore."
          set +e
          node scripts/digest.mjs --raw --window="$FEREASTRA" > post.txt 2> compose.err
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat compose.err

      - name: Nimic de postat, zi liniștită
        if: steps.compose.outputs.code == '4'
        run: echo "Colectorul n-a adus articole. Nu e eroare, nu alertez."

      - name: Publică pe Facebook
        id: publish
        if: steps.compose.outputs.code == '0'
        env:
          WEBHOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          # Textul intră în JSON prin jq, nu prin interpolare: titlurile conțin
          # ghilimele, diacritice și apostrofuri care ar strica payload-ul.
          jq -Rs --arg link "https://buzau365.ro" '{text: ., link: $link}' post.txt > payload.json

          publish() {
            curl -sS -X POST "$WEBHOOK" \
              -H "content-type: application/json" \
              --data-binary @payload.json \
              --max-time 120 \
              -w '%{http_code}' -o response.txt
          }

          code=$(publish)
          if [ "$code" != "200" ]; then
            echo "Prima încercare a răspuns $code. Reîncerc peste 60 de secunde."
            sleep 60
            code=$(publish)
          fi

          echo "--- răspuns Make ---"
          cat response.txt || true
          echo ""

          if [ "$code" != "200" ]; then
            echo "Publicarea a eșuat definitiv (HTTP $code)."
            exit 1
          fi

      # Chitanța. Rulează și la eșec, ca să ai textul la îndemână pe telefon.
      - name: Deschide issue-ul
        if: always() && steps.compose.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          if [ "$PUBLISHED" = "success" ]; then
            title="Postat pe Facebook — $(date -u +'%d.%m.%Y')"
            {
              echo "Postarea de azi a plecat automat pe pagină. Nu ai nimic de făcut."
              echo ""
              echo '```'
              cat post.txt
              echo '```'
            } > issue.md
          else
            title="EȘEC la postare — $(date -u +'%d.%m.%Y')"
            {
              echo "**Postarea nu a plecat.** Textul e mai jos, îl poți publica manual."
              echo ""
              echo '```'
              cat post.txt
              echo '```'
              echo ""
              echo "Detalii în [rularea workflow-ului]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            } > issue.md
          fi
          gh issue create --title "$title" --body-file issue.md --label "promovare" \
            || gh issue create --title "$title" --body-file issue.md

      - name: Alertă pe Telegram
        # Doar la probleme reale: publicare eșuată sau date vechi. Ziua fără
        # articole (codul 4) nu e problemă și nu deranjează.
        if: always() && (steps.publish.outcome == 'failure' || steps.compose.outputs.code == '3')
        env:
          WEBHOOK: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          CODE: ${{ steps.compose.outputs.code }}
        run: |
          if [ "$CODE" = "3" ]; then
            msg="Buzau365: colectarea e mai veche de 26h, nu am postat nimic azi. Probabil au picat sursele."
          else
            msg="Buzau365: postarea pe Facebook a esuat. Textul e in issue, il poti pune manual. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          jq -n --arg t "$msg" '{text: $t}' \
            | curl -sS -X POST "$WEBHOOK" -H "content-type: application/json" --data-binary @- \
            || echo "Nici alerta pe Telegram n-a plecat."

      - name: Marchează rularea ca eșuată
        if: steps.compose.outputs.code != '0' && steps.compose.outputs.code != '4'
        run: |
          echo "digest.mjs a ieșit cu codul ${{ steps.compose.outputs.code }}."
          exit 1
